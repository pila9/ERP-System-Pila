; Keep the container environment visible to PHP.
;
; php-fpm defaults to clear_env = yes, which strips the environment before
; handing it to the worker. Laravel then falls back to the .env file baked
; into the image, so every value in the compose "environment:" block
; (APP_ENV, APP_DEBUG, LOG_LEVEL, CORS_ALLOWED_ORIGINS, DB_*) is ignored.
; Loading this file last (zz-) makes it override the image defaults.
[www]
clear_env = no
