name: erp

x-node-env: &node-env
  NODE_ENV: ${NODE_ENV:-development}
  PORT: ${PORT:-3000}
  DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/erp_db?schema=public}
  JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production-min-32-chars}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}

services:
  db:
    image: postgres:16-alpine
    container_name: erp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-erp_db}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-erp_db}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  api:
    build:
      context: ./api-node
      dockerfile: Dockerfile
    container_name: erp-api
    restart: unless-stopped
    environment:
      <<: *node-env
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

  assets:
    image: node:22-alpine
    container_name: erp-assets
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_dist:/app/dist
    command:
      - sh
      - -c
      - |
        if [ -f dist/index.html ] && [ -d dist/assets ] && [ -n "$$(ls -A dist/assets 2>/dev/null)" ] && [ "$${FORCE_BUILD:-0}" != "1" ]; then
          echo "[assets] dist/index.html already present - skipping build (FORCE_BUILD=1 to rebuild)"
          exit 0
        fi
        echo "[assets] installing dependencies..."
        if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
        echo "[assets] building production bundle..."
        npm run build

  web:
    image: nginx:1.27-alpine
    container_name: erp-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_started
      assets:
        condition: service_completed_successfully

  vite:
    image: node:22-alpine
    container_name: erp-vite
    profiles: ["dev"]
    working_dir: /app
    environment:
      VITE_API_URL: /api
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "${VITE_PORT:-5173}:5173"
    depends_on:
      - api

  shell:
    image: erp-api
    container_name: erp-shell
    profiles: ["tools"]
    entrypoint: /bin/bash
    environment:
      <<: *node-env
    depends_on:
      - api

volumes:
  db_data:
  frontend_dist:
  frontend_node_modules: