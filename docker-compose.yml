name: erp

x-backend-env: &backend-env
  APP_NAME: ERP
  APP_ENV: local
  APP_DEBUG: "true"
  APP_URL: ${APP_URL:-http://localhost:8080}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
  APP_TIMEZONE: UTC
  APP_LOCALE: en
  APP_FALLBACK_LOCALE: en
  LOG_CHANNEL: stack
  LOG_LEVEL: debug
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: "3306"
  DB_DATABASE: ${DB_DATABASE:-erp}
  DB_USERNAME: ${DB_USERNAME:-erp}
  DB_PASSWORD: ${DB_PASSWORD:-secret}
  CACHE_STORE: file
  QUEUE_CONNECTION: sync
  SESSION_DRIVER: file
  SANCTUM_STATEFUL_DOMAINS: localhost,localhost:5173
  AUTO_MIGRATE: "true"
  AUTO_SEED: "true"

services:
  db:
    image: mysql:8.0
    container_name: erp-db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-erp}
      MYSQL_USER: ${DB_USERNAME:-erp}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "${DB_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erp-api
    restart: unless-stopped
    environment:
      <<: *backend-env
    volumes:
      - api_storage:/var/www/html/storage
      - api_bootstrap_cache:/var/www/html/bootstrap/cache
    depends_on:
      db:
        condition: service_healthy

  assets:
    image: node:22-alpine
    container_name: erp-assets
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_dist:/app/dist
    command:
      - sh
      - -c
      - |
        if [ -f dist/index.html ] && [ -d dist/assets ] && [ -n "$$(ls -A dist/assets 2>/dev/null)" ] && [ "$${FORCE_BUILD:-0}" != "1" ]; then
          echo "[assets] dist/index.html already present - skipping build (FORCE_BUILD=1 to rebuild)"
          exit 0
        fi
        echo "[assets] installing dependencies..."
        if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
        echo "[assets] building production bundle..."
        npm run build

  web:
    image: nginx:1.27-alpine
    container_name: erp-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_started
      assets:
        condition: service_completed_successfully

  vite:
    image: node:22-alpine
    container_name: erp-vite
    profiles: ["dev"]
    working_dir: /app
    environment:
      VITE_API_URL: /api
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "${VITE_PORT:-5173}:5173"
    depends_on:
      - api

  shell:
    image: erp-api
    container_name: erp-shell
    profiles: ["tools"]
    entrypoint: /bin/bash
    environment:
      <<: *backend-env
    depends_on:
      - api

volumes:
  db_data:
  api_storage:
  api_bootstrap_cache:
  frontend_dist:
  frontend_node_modules: